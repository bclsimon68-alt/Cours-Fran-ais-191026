<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Modules FLE B2 — Atelier interactif</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1A3A5C; --navy-dark:#0D2137; --gold:#D4AC0D; --gold-soft:#F3E8C2;
    --green:#1E8449; --green-bg:#E8F8EF; --paper:#FAF8F3; --ink:#1F2A37; --line:#D8E0E8;
    --shadow: 0 10px 30px rgba(13,33,55,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;}
  .wrap{max-width:880px;margin:0 auto;padding:36px 20px 80px;}

  header.top{display:flex;align-items:center;gap:16px;margin-bottom:8px;}
  .crest{width:46px;height:46px;border-radius:50%;background:linear-gradient(160deg,var(--navy),var(--navy-dark));
    display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Source Serif 4',serif;font-weight:700;font-size:18px;flex:none;}
  h1{font-family:'Source Serif 4',serif;font-weight:700;font-size:28px;margin:0;color:var(--navy);}
  .kicker{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A93A0;margin:0 0 2px;}

  .tabs{display:flex;gap:10px;margin:30px 0 22px;border-bottom:2px solid var(--line);}
  .tab{cursor:pointer;padding:12px 18px 14px;font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;
    color:#8A93A0;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;}
  .tab:hover{color:var(--navy);}
  .tab.active{color:var(--navy);border-bottom-color:var(--gold);}
  .tab .num{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--gold-soft);color:var(--navy);
    font-family:'Inter',sans-serif;font-size:11px;font-weight:700;text-align:center;line-height:20px;margin-right:8px;}

  .module{display:none;}
  .module.active{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .theme-banner{background:linear-gradient(120deg,var(--navy),var(--navy-dark));border-radius:14px;padding:24px 26px;
    color:#fff;box-shadow:var(--shadow);margin-bottom:24px;}
  .theme-banner .badge{display:inline-block;background:var(--gold);color:var(--navy-dark);font-weight:700;font-size:11px;
    letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
  .theme-banner h2{font-family:'Source Serif 4',serif;font-size:22px;margin:0;line-height:1.3;}

  .progress{display:flex;gap:5px;margin:14px 0 28px;}
  .progress .seg{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
  .progress .seg i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s;}

  section.block{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 3px rgba(13,33,55,.04);}
  .block-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;background:#fff;}
  .block-head:hover{background:#FBFAF6;}
  .block-head .title{display:flex;align-items:center;gap:12px;font-family:'Source Serif 4',serif;font-weight:600;font-size:17px;color:var(--navy);}
  .block-head .num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-family:'Inter';font-size:12px;
    font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  .chev{transition:transform .25s;color:#8A93A0;}
  section.block.open .chev{transform:rotate(180deg);}
  .block-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  section.block.open .block-body{max-height:20000px;}
  .block-inner{padding:4px 20px 22px;}

  .texte p{font-size:15px;color:#2C3A4A;text-align:justify;margin:0 0 12px;}
  .consigne{font-style:italic;color:#5C6B7A;font-size:13.5px;margin-bottom:14px;}

  .q{margin-bottom:16px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .q .qtext{font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:8px;}
  .answer-box{display:none;background:var(--green-bg);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;
    color:var(--green);font-size:13.5px;font-weight:500;margin-top:8px;}
  .answer-box.show{display:block;}
  .reveal-btn{font-family:'Inter';font-size:12px;font-weight:600;color:var(--navy);background:var(--gold-soft);
    border:none;padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s;}
  .reveal-btn:hover{background:var(--gold);}

  .vocab-ex{margin-bottom:22px;}
  .vocab-ex h4{font-family:'Source Serif 4',serif;font-size:14.5px;color:var(--navy);margin:0 0 6px;border-left:3px solid var(--gold);padding-left:8px;}
  .vocab-ex.green h4{border-left-color:var(--green);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .chip{background:#F1F4F8;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;position:relative;}
  .chip .pop{display:none;position:absolute;left:0;top:110%;background:var(--navy-dark);color:#fff;padding:7px 10px;border-radius:7px;
    font-size:12px;white-space:normal;width:max-content;max-width:240px;z-index:5;box-shadow:var(--shadow);}
  .chip.open .pop{display:block;}
  table.fam{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  table.fam th{background:var(--navy);color:#fff;padding:7px 9px;text-align:left;font-weight:600;}
  table.fam td{padding:7px 9px;border-bottom:1px solid var(--line);}
  .fam-input{width:90%;font-family:'Inter';font-size:12.5px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;}
  .fam-input:focus{outline:none;border-color:var(--navy);}
  table.corr-table{display:none;}
  table.corr-table.show{display:table;}
  table.corr-table td{background:var(--green-bg);color:var(--green);font-weight:600;}
  table.corr-table th{background:var(--green);}
  .match-cols{display:flex;gap:24px;margin-top:6px;}
  .match-col{flex:1;}
  .match-col h5{font-family:'Source Serif 4',serif;font-size:13px;color:var(--navy);margin:0 0 6px;}
  .match-line{font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:#FBFAF6;}
  .match-answers{margin-top:10px;}
  .vocab-input-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .vi-word{min-width:140px;font-weight:600;font-size:13.5px;color:var(--ink);}
  .vocab-input-row.sentence{flex-direction:column;align-items:stretch;background:#FBFAF6;border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;}
  .vocab-input-row.sentence .vi-word{min-width:0;font-weight:500;font-size:13.5px;margin-bottom:6px;}
  .vi-field{flex:1;font-family:'Inter';font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;}
  .vi-field:focus{outline:none;border-color:var(--navy);}
  .vocab-corr-box{margin-top:6px;}
  .expl-inline{font-size:12px; color:var(--green); opacity:0.85; margin-top:3px; font-style:italic;}

  .gram-item{margin-bottom:12px;}
  .gram-item .phrase{font-size:13.8px;}
  .gram-item input{font-family:'Inter';font-size:13px;border:none;border-bottom:1px dotted #A9B4C0;padding:2px 4px;width:160px;background:transparent;}
  .gram-item input:focus{outline:none;border-color:var(--navy);}
  .check-btn{font-family:'Inter';font-size:11.5px;font-weight:600;color:#fff;background:var(--navy);border:none;
    padding:4px 10px;border-radius:14px;cursor:pointer;margin-left:6px;}
  .gram-feedback{font-size:12.5px;margin-top:5px;display:none;}
  .speak-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:8px;
    border:none;background:rgba(255,255,255,.55);border-radius:50%;cursor:pointer;font-size:12px;vertical-align:middle;
    box-shadow:0 1px 2px rgba(0,0,0,.15);flex:none;}
  .speak-btn:hover{background:#fff;}
  .speak-btn.playing{background:var(--gold);}
  .corr-table td, .pop{position:relative;}
  .gram-feedback.ok{color:var(--green);display:block;}
  .gram-feedback.no{color:#B5454A;display:block;}
  .expl{display:none;background:var(--gold-soft);border-radius:7px;padding:7px 10px;font-size:12px;color:#5C4A0A;margin-top:5px;}
  .expl.show{display:block;}

  .reform-item{border-left:3px solid var(--navy);padding-left:12px;margin-bottom:16px;}
  .technique{font-size:12px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}

  .expr-box{background:#FBFAF6;border:1px dashed var(--line);border-radius:10px;padding:16px;}
  textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:'Inter';font-size:13.5px;resize:vertical;}
  .wordcount{font-size:12px;color:#8A93A0;text-align:right;margin-top:4px;}
  .grille{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
  .grille th{background:var(--navy);color:#fff;padding:8px;text-align:left;}
  .grille td{padding:8px;border-bottom:1px solid var(--line);}
  .model-toggle{margin-top:16px;}
  .model-box{display:none;margin-top:12px;background:var(--green-bg);border:1px solid var(--gold);border-radius:10px;padding:16px;font-size:13.5px;}
  .model-box.show{display:block;}
  .model-box p{margin:0 0 10px;text-align:justify;}

  footer{text-align:center;color:#9AA4B0;font-size:12px;margin-top:30px;}

  /* ---- Module QCM / Vrai-Faux ---- */
  .qcm-scorebar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:14px;font-weight:600;color:var(--navy);}
  .qcm-total{font-size:20px;font-weight:700;}
  .qcm-sec-head{font-size:13px;color:#5C6B7A;margin-bottom:12px;}
  .qcm-sec-score{font-weight:700;color:var(--navy);}
  .qcm-q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:#fff;}
  .qcm-qtext{font-weight:600;font-size:14.5px;margin-bottom:10px;line-height:1.45;}
  .qcm-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 8px;border-radius:10px;margin-right:6px;vertical-align:1px;}
  .qcm-tag.qcm{background:var(--gold-soft);color:var(--navy);}
  .qcm-tag.vf{background:#E3ECF7;color:var(--navy);}
  .qcm-opts{display:flex;flex-direction:column;gap:7px;}
  .qcm-opts.vf{flex-direction:row;}
  .qcm-opts.vf .qcm-opt{flex:1;}
  .qcm-opt{display:flex;align-items:center;gap:10px;text-align:left;font-family:'Inter',sans-serif;font-size:13.5px;
    color:var(--ink);background:#FBFAF6;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;transition:.15s;}
  .qcm-opt:hover:not(:disabled){border-color:var(--navy);background:#F3F6FA;}
  .qcm-letter{flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;
    font-weight:700;display:flex;align-items:center;justify-content:center;}
  .qcm-opt:disabled{cursor:default;color:var(--ink);}
  .qcm-opt:disabled:not(.ok):not(.ko){opacity:.6;}
  .qcm-opt.ok{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600;}
  .qcm-opt.ko{background:#FBEAEA;border-color:#B5454A;color:#B5454A;}
  .qcm-fb{display:none;margin-top:10px;font-size:13px;border-radius:8px;padding:10px 12px;line-height:1.45;}
  .qcm-fb.show{display:block;}
  .qcm-fb.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--gold);}
  .qcm-fb.ko{background:#FDF3E3;color:#7A4B00;border:1px solid var(--gold);}
  .qcm-why{margin-top:4px;font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="crest">B2</div>
    <div style="flex:1;">
      <p class="kicker">Cours FLE — Niveau B2</p>
      <h1>Atelier de compréhension &amp; d'expression</h1>
    </div>
    <button id="resetBtn" style="font-family:'Inter';font-size:11.5px;font-weight:600;color:#8A93A0;background:none;
      border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;">Réinitialiser ma progression</button>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="modules"></div>

  <footer>Cliquez sur une section pour l'ouvrir, sur « Voir la réponse » pour vérifier · votre progression et vos réponses sont sauvegardées automatiquement dans ce navigateur.</footer>
</div>

<script>
const DATA = [
{
  slug:"climat_faune", titre:"Module 1", theme:"Le dérèglement climatique et ses conséquences sur la faune sauvage",
  texte:[
"Le réchauffement climatique ne modifie pas seulement les paysages ; il bouleverse en profondeur les équilibres qui régissent la faune sauvage. Des pôles aux tropiques, des espèces entières voient leur habitat se réduire à un rythme que la science peine encore à mesurer précisément.",
"Chez les ours polaires, la fonte accélérée de la banquise réduit le territoire de chasse et menace directement leur survie ; chez les coraux, l'élévation de la température des océans provoque un blanchissement massif qui prive des milliers d'espèces marines de leur habitat naturel. Plusieurs espèces migratoires voient également leurs cycles perturbés, arrivant trop tôt ou trop tard sur des territoires dont les ressources ne sont plus synchronisées avec leurs besoins.",
"Il est indispensable que les politiques de conservation prennent en compte cette dimension climatique, sans quoi les efforts de préservation resteront vains. Bien que certaines espèces parviennent à s'adapter en migrant vers des zones plus fraîches, la majorité d'entre elles n'ont ni le temps ni l'espace nécessaires pour suivre ce rythme effréné.",
"Face à cette hémorragie silencieuse de la biodiversité, des solutions existent : corridors écologiques, restauration des habitats, réduction drastique des émissions. Encore faut-il que la communauté internationale s'accorde sur l'urgence d'agir avant que certains équilibres ne deviennent irréversibles."
],
  comprehension:[
   ["Quels sont les deux exemples d'espèces directement touchées par le réchauffement climatique cités dans le deuxième paragraphe ?","Les ours polaires, menacés par la fonte de la banquise, et les coraux, touchés par le blanchissement dû à l'élévation de la température des océans."],
   ["Pourquoi les cycles des espèces migratoires sont-ils perturbés ?","Parce qu'elles arrivent trop tôt ou trop tard sur des territoires dont les ressources ne sont plus synchronisées avec leurs besoins."],
   ["Quelles solutions sont évoquées dans le dernier paragraphe pour protéger la biodiversité ?","Les corridors écologiques, la restauration des habitats et la réduction drastique des émissions."],
   ["Quelle est l'idée principale du troisième paragraphe ?","Les politiques de conservation doivent intégrer la dimension climatique, car la majorité des espèces ne peuvent s'adapter assez vite."],
   ["Quel contraste l'auteur établit-il concernant la capacité d'adaptation des espèces ?","Il oppose les quelques espèces capables de migrer vers des zones plus fraîches à la majorité qui n'a ni le temps ni l'espace pour s'adapter."],
   ["Quelle est l'intention de l'auteur en concluant sur l'urgence d'un accord international ?","Il souligne que les solutions techniques existent déjà mais restent inefficaces sans une volonté politique collective et rapide."],
   ["Que signifie l'expression « cette hémorragie silencieuse de la biodiversité » employée dans le texte ?","Une perte massive et continue d'espèces qui passe largement inaperçue du grand public."],
   ["En quoi l'expression « avant que certains équilibres ne deviennent irréversibles » illustre-t-elle l'urgence évoquée par l'auteur ?","Elle souligne qu'un point de non-retour existe, au-delà duquel certains dommages ne pourront plus être réparés."]
  ],
  vocab:[
   {titre:"1. Synonymes", input:true, consigne:"Trouvez un synonyme pour chaque mot du texte.",items:["bouleverse","blanchissement","effréné","irréversibles"],corr:["transforme profondément","décoloration (des coraux)","très rapide, incontrôlé","définitifs, sans retour possible"]},
   {titre:"2. Antonymes", input:true, consigne:"Donnez un antonyme pour chaque terme.",items:["accélérée","synchronisées","drastique","silencieuse"],corr:["ralentie","désynchronisées, décalées","légère, modérée","visible, médiatisée"]},
   {titre:"3. Famille de mots",consigne:"Verbe / Nom / Adjectif.",table:[["réchauffer","réchauffement","réchauffé"],["menacer","menace","menacé"],["adapter","adaptation","adapté"],["restaurer","restauration","restauré"],["préserver","préservation","préservé"]]},
   {titre:"4. Collocations",consigne:"Associez chaque verbe à son complément.",items:["fondre","blanchir","perturber","réduire","restaurer"],corr:["fondre → la banquise","blanchir → les coraux","perturber → les cycles migratoires","réduire → les émissions","restaurer → les habitats naturels"]},
   {titre:"5. Expressions et sens figuré",consigne:"Expliquez le sens des expressions suivantes.",items:["cette hémorragie silencieuse de la biodiversité","avant que certains équilibres ne deviennent irréversibles","un rythme effréné","des pôles aux tropiques"],corr:["Une perte massive et continue d'espèces, largement invisible du grand public.","Avant qu'un point de non-retour ne soit atteint.","Une vitesse très rapide, presque incontrôlable.","Du monde entier, sans exception géographique."]},
   {titre:"6. Articles et prépositions", input:true, consigne:"Complétez avec l'article ou la préposition qui convient.",items:["Le réchauffement climatique bouleverse ___ équilibres ___ la faune sauvage.","Cette étude porte ___ l'impact du climat ___ les espèces marines.","Les ours polaires sont exposés ___ une réduction de leur territoire.","Il est essentiel d'investir ___ des corridors écologiques.","Les scientifiques doivent rendre compte ___ leurs observations."],corr:["les / de","sur / sur","à","dans","de"],
    expl:["« les » : article défini pluriel (généralité) · « de » : possession.","« porter sur » : construction fixe, répétée deux fois ici.","« exposé à » : construction adjectivale fixe.","« investir dans » : construction verbale fixe.","« rendre compte de » : construction verbale fixe."]},
   {titre:"7. Connecteurs logiques", input:true, green:true,consigne:"Complétez avec : néanmoins, dans la mesure où, de sorte que, quand bien même, dès lors que.",items:["___ certaines espèces s'adapteraient rapidement, la majorité resterait menacée.","La banquise fond rapidement, ___ les ours polaires perdent leur territoire de chasse.","Cette situation est alarmante ___ elle touche des écosystèmes entiers.","Des solutions existent ; ___, leur mise en œuvre reste insuffisante.","___ un habitat disparaît, c'est tout un écosystème qui se fragilise."],corr:["Quand bien même","de sorte que","dans la mesure où","néanmoins","Dès lors que"],
    expl:["« quand bien même » + conditionnel (s'adapteraient) : concession hypothétique forte.","« de sorte que » introduit la conséquence.","« dans la mesure où » introduit la cause/justification.","« néanmoins » marque l'opposition avec ce qui précède.","« dès lors que » = du moment où (condition/cause réalisée)."]},
   {titre:"8. Reformulation de définitions",consigne:"Reformulez avec vos propres mots.",items:["dérèglement climatique","corridor écologique","blanchissement corallien","espèce menacée"],corr:["Modification durable des conditions climatiques mondiales, notamment liée aux activités humaines.","Espace naturel reliant deux habitats et permettant aux espèces de circuler.","Décoloration des coraux causée par le stress thermique, souvent mortelle.","Espèce dont la population décline au point de risquer la disparition."]}
  ],
  grammar:[
   {code:"G1",titre:"Subjonctif présent",consigne:"Conjuguez au subjonctif présent.",items:["Il est indispensable que les politiques de conservation (prendre) en compte la dimension climatique.","Bien que certaines espèces (parvenir) à s'adapter, la majorité reste vulnérable.","Il faut que la communauté internationale (s'accorder) sur l'urgence d'agir.","Je doute que ces mesures (suffire) à enrayer le déclin de la biodiversité."],corr:["prennent","parviennent","s'accorde","suffisent"],expl:["nécessité impersonnelle + subjonctif","concession (bien que) + subjonctif","obligation impersonnelle + subjonctif","doute + subjonctif"]},

   modele:"Opposer systématiquement protection de la biodiversité et intérêts économiques relèverait d'une vision trop simpliste des enjeux contemporains.\n\nIl est vrai que de nombreux secteurs économiques reposent sur l'exploitation des ressources naturelles, qu'il s'agisse de l'agriculture intensive, de l'exploitation forestière ou de la pêche industrielle. Imposer des restrictions environnementales strictes peut ainsi menacer des emplois et fragiliser des économies locales déjà vulnérables, en particulier dans les pays en développement.\n\nPour autant, sacrifier la biodiversité sur l'autel de la croissance à court terme relève d'un calcul dangereux. Les écosystèmes rendent des services essentiels — pollinisation, régulation du climat, purification de l'eau — dont dépend, in fine, l'activité économique elle-même. Une forêt détruite aujourd'hui prive demain une région entière de ressources qu'elle ne pourra plus jamais exploiter.\n\nLa véritable question n'est donc pas de choisir entre économie et environnement, mais de repenser les modèles économiques pour qu'ils intègrent la valeur du vivant. Cela suppose des investissements massifs dans les énergies propres, une fiscalité incitative pour les pratiques durables, et une coopération internationale à la hauteur de l'urgence.\n\nEn définitive, protéger la biodiversité n'est pas un luxe que seuls les pays riches pourraient s'offrir, mais une condition de la prospérité économique de long terme."}

   modele:"Renforcer sa souveraineté économique en réponse aux crises géopolitiques est une tentation compréhensible, mais qui comporte ses propres risques si elle se traduit par un repli généralisé.\n\nIl est vrai que la dépendance excessive envers un nombre restreint de fournisseurs, qu'il s'agisse d'énergie ou de matières premières, expose les pays à des chocs difficilement maîtrisables. Diversifier ses approvisionnements, investir dans les énergies renouvelables et relocaliser certaines productions stratégiques constituent des réponses de bon sens face à cette vulnérabilité.\n\nPour autant, réduire drastiquement les échanges internationaux au nom de la souveraineté reviendrait à se priver des bénéfices de la spécialisation économique mondiale, qui a permis, historiquement, une baisse des coûts et un accès plus large à de nombreux biens. Un repli trop marqué risquerait également d'isoler les économies les plus fragiles, moins en mesure de produire seules l'ensemble de leurs besoins.\n\nLa voie la plus raisonnable semble résider dans un équilibre : maintenir une ouverture commerciale tout en sécurisant les secteurs jugés véritablement stratégiques, sans céder à la tentation d'un protectionnisme généralisé qui pénaliserait davantage qu'il ne protégerait.\n\nEn définitive, la souveraineté économique ne devrait pas signifier l'isolement, mais une interdépendance mieux maîtrisée et plus résiliente face aux chocs futurs."}

const SECTION_TITLES = ["Texte de départ","Compréhension","Vocabulaire","Grammaire","Reformulation","Expression écrite"];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}

// ---------------------------------------------------------------- LECTURE AUDIO (synthèse vocale du navigateur)
let _speakBtnEls = [];
function speakFR(text, btnEl){
  try{
    window.speechSynthesis.cancel();
    _speakBtnEls.forEach(b=>b.classList.remove('playing'));
    const clean = String(text).replace(/^[✔✘]\s*/,'').replace(/\n+/g,' ').trim();
    if(!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'fr-FR';
    u.rate = 0.95;
    if(btnEl){ btnEl.classList.add('playing'); u.onend = ()=>btnEl.classList.remove('playing'); u.onerror = ()=>btnEl.classList.remove('playing'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function makeSpeakBtn(text){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'speak-btn'; b.innerHTML = '🔊'; b.title = 'Écouter';
  b.onclick = (e)=>{ e.stopPropagation(); e.preventDefault(); speakFR(text, b); };
  _speakBtnEls.push(b);
  return b;
}
function addSpeakButtons(root){
  if(!('speechSynthesis' in window)) return;
  (root||document).querySelectorAll('.answer-box, .corr-table td, .pop').forEach(node=>{
    if(node.querySelector('.speak-btn')) return;
    const txt = node.textContent.trim();
    if(!txt) return;
    node.appendChild(makeSpeakBtn(txt));
  });
}

function buildModule(mod, idx){
  const wrap = el('div','module'+(idx===0?' active':''));
  wrap.id = 'mod-'+mod.slug;

  const banner = el('div','theme-banner');
  banner.innerHTML = `<span class="badge">${mod.titre} · Niveau B2</span><h2>${mod.theme}</h2>`;
  wrap.appendChild(banner);

  const progress = el('div','progress');
  for(let i=0;i<6;i++){const seg=el('div','seg'); seg.innerHTML='<i></i>'; progress.appendChild(seg);}
  wrap.appendChild(progress);

  // Section 1 - texte
  wrap.appendChild(buildBlock(0,"Texte de départ", body=>{
    mod.texte.forEach(p=>body.appendChild(el('p',null,p)));
  }, mod));

  // Section 2 - compréhension
  wrap.appendChild(buildBlock(1,"Compréhension", body=>{
    body.appendChild(el('p','consigne','Répondez mentalement, puis vérifiez votre compréhension.'));
    mod.comprehension.forEach((qa,i)=>{
      const q = el('div','q');
      q.appendChild(el('div','qtext', (i+1)+'. '+qa[0]));
      const btn = el('button','reveal-btn','Voir la réponse');
      const ans = el('div','answer-box','✔ '+qa[1]);
      const pkey = mod.slug+'.comp.'+i;
      if(loadField(pkey)==='1') ans.classList.add('show');
      btn.onclick = ()=>{ans.classList.toggle('show'); saveField(pkey, ans.classList.contains('show')?'1':'0'); markProgress(mod,1);};
      q.appendChild(btn); q.appendChild(ans);
      body.appendChild(q);
    });
  }, mod));

  // Section 3 - vocabulaire
  wrap.appendChild(buildBlock(2,"Vocabulaire", body=>{
    mod.vocab.forEach(ex=>{
      const box = el('div','vocab-ex'+(ex.green?' green':''));
      box.appendChild(el('h4',null,ex.titre));
      box.appendChild(el('p','consigne',ex.consigne));
      if(ex.input){
        ex.items.forEach((it,i)=>{
          const row = el('div', it.includes('___') ? 'vocab-input-row sentence' : 'vocab-input-row');
          const fid = mod.slug+'-'+ex.titre.replace(/\s+/g,'')+'-'+i;
          row.innerHTML = `<span class="vi-word">${it}</span>
            <input type="text" class="vi-field" id="${fid}" placeholder="votre réponse…" />`;
          const inp = row.querySelector('input');
          const saved = loadField(fid);
          if(saved) inp.value = saved;
          inp.addEventListener('input', ()=>saveField(fid, inp.value));
          box.appendChild(row);
        });
        const revealBtn = el('button','reveal-btn','Voir la correction');
        revealBtn.style.marginTop = '8px';
        const corrBox = el('div','vocab-corr-box');
        corrBox.innerHTML = ex.items.map((it,i)=>`<div class="answer-box show" style="margin-bottom:5px;">
            <div>✔ ${it} → ${ex.corr[i]}</div>
            ${ex.expl && ex.expl[i] ? '<div class="expl-inline">ℹ '+ex.expl[i]+'</div>' : ''}
          </div>`).join('');
        corrBox.style.display = 'none';
        revealBtn.onclick = ()=>{ corrBox.style.display = corrBox.style.display==='none' ? 'block' : 'none'; markProgress(mod,2); };
        box.appendChild(revealBtn);
        box.appendChild(corrBox);
      } else if(ex.match){
        const cols = el('div','match-cols');
        const colV = el('div','match-col');
        colV.innerHTML = '<h5>Verbes</h5>' + ex.verbes.map(v=>`<div class="match-line">${v}</div>`).join('');
        const colC = el('div','match-col');
        colC.innerHTML = '<h5>Compléments</h5>' + ex.complements.map(c=>`<div class="match-line">${c}</div>`).join('');
        cols.appendChild(colV); cols.appendChild(colC);
        box.appendChild(cols);
        const revealBtn = el('button','reveal-btn','Voir les réponses');
        revealBtn.style.marginTop = '10px';
        const ansBox = el('div','match-answers');
        ansBox.innerHTML = ex.reponses.map(r=>`<div class="answer-box show" style="margin-bottom:6px;">✔ ${r}</div>`).join('');
        ansBox.style.display = 'none';
        revealBtn.onclick = ()=>{ ansBox.style.display = ansBox.style.display==='none' ? 'block' : 'none'; markProgress(mod,2); };
        box.appendChild(revealBtn);
        box.appendChild(ansBox);
      } else if(ex.table){
        const t = el('table','fam');
        t.innerHTML = '<tr><th>Verbe</th><th>Nom</th><th>Adjectif</th></tr>' +
          ex.table.map((r,ri)=>`<tr><td>${r[0]}</td>
            <td><input type="text" class="fam-input" placeholder="trouvez le nom…" /></td>
            <td><input type="text" class="fam-input" placeholder="trouvez l'adjectif…" /></td></tr>`).join('');
        box.appendChild(t);
        const revealBtn = el('button','reveal-btn','Voir la correction');
        revealBtn.style.marginTop = '10px';
        const corrTable = el('table','fam corr-table');
        corrTable.innerHTML = '<tr><th>Verbe</th><th>Nom</th><th>Adjectif</th></tr>' +
          ex.table.map(r=>`<tr><td>${r[0]}</td><td>✔ ${r[1]}</td><td>✔ ${r[2]}</td></tr>`).join('');
        revealBtn.onclick = ()=>{ corrTable.classList.toggle('show'); markProgress(mod,2); };
        box.appendChild(revealBtn);
        box.appendChild(corrTable);
      } else {
        const row = el('div','chip-row');
        ex.items.forEach((it,i)=>{
          const chip = el('div','chip', it+'<div class="pop">'+ex.corr[i]+'</div>');
          chip.onclick = ()=>{chip.classList.toggle('open'); markProgress(mod,2);};
          row.appendChild(chip);
        });
        box.appendChild(row);
      }
      body.appendChild(box);
    });
  }, mod));

  // Section 4 - grammaire
  wrap.appendChild(buildBlock(3,"Grammaire", body=>{
    mod.grammar.forEach(g=>{
      body.appendChild(el('h4',null,g.code+' — '+g.titre));
      body.appendChild(el('p','consigne',g.consigne));
      g.items.forEach((it,i)=>{
        const gi = el('div','gram-item');
        const inputId = mod.slug+'-'+g.code+'-'+i;
        gi.innerHTML = `<span class="phrase">${it}</span> <input id="${inputId}" placeholder="réponse" />
          <button class="check-btn">Vérifier</button>
          <div class="gram-feedback"></div>
          ${g.expl[i] ? '<div class="expl">💡 '+g.expl[i]+'</div>' : ''}`;
        const btn = gi.querySelector('.check-btn');
        const input = gi.querySelector('input');
        const fb = gi.querySelector('.gram-feedback');
        const exp = gi.querySelector('.expl');
        const saved = loadField(inputId);
        if(saved) input.value = saved;
        input.addEventListener('input', ()=>saveField(inputId, input.value));
        btn.onclick = ()=>{
          const val = input.value.trim().toLowerCase();
          const correct = g.corr[i].toLowerCase();
          if(val.length===0){ fb.textContent='Entrez une réponse, puis cliquez à nouveau.'; fb.className='gram-feedback no'; return; }
          if(correct.includes(val) || val.includes(correct.split(' ')[0])){
            fb.textContent = '✔ Correct : '+g.corr[i]; fb.className='gram-feedback ok';
          } else {
            fb.textContent = '✘ Réponse attendue : '+g.corr[i]; fb.className='gram-feedback no';
          }
          fb.appendChild(makeSpeakBtn(g.corr[i]));
          if(exp) exp.classList.add('show');
          markProgress(mod,3);
        };
        body.appendChild(gi);
      });
    });
  }, mod));

  // Section 5 - reformulation
  wrap.appendChild(buildBlock(4,"Reformulation", body=>{
    body.appendChild(el('p','consigne',"Reformulez chaque phrase à l'aide de la technique indiquée, puis vérifiez."));
    mod.reformulation.forEach((r,i)=>{
      const item = el('div','reform-item');
      item.innerHTML = `<div class="technique">${r[1]}</div><div class="qtext">${i+1}. ${r[0]}</div>`;
      const btn = el('button','reveal-btn','Voir la reformulation');
      const ans = el('div','answer-box','✔ '+r[2]);
      btn.onclick = ()=>{ans.classList.toggle('show'); markProgress(mod,4);};
      item.appendChild(btn); item.appendChild(ans);
      body.appendChild(item);
    });
  }, mod));

  // Section 6 - expression écrite
  wrap.appendChild(buildBlock(5,"Expression écrite", body=>{
    const box = el('div','expr-box');
    box.appendChild(el('p',null,'<strong>Sujet :</strong> '+mod.expression.sujet));
    const ul = el('ul',null, mod.expression.consignes.map(c=>'<li>'+c+'</li>').join(''));
    box.appendChild(ul);
    const ta = el('textarea',null); ta.placeholder = 'Rédigez votre texte ici (~250 mots)…';
    const taId = mod.slug+'-expr';
    const savedTa = loadField(taId);
    if(savedTa) ta.value = savedTa;
    box.appendChild(ta);
    const wc = el('div','wordcount', savedTa ? (savedTa.trim().split(/\s+/).filter(Boolean).length)+' mots' : '0 mot');
    ta.addEventListener('input', ()=>{

      saveField(taId, ta.value);
      markProgress(mod,5);
    });
    box.appendChild(wc);

    const mbox = el('div','model-box');
    mbox.innerHTML = mod.expression.modele.split('\n\n').map(p=>'<p>'+p+'</p>').join('') +
      '<table class="grille"><tr><th>Critère</th><th>Note</th></tr>' +
      mod.expression.grille.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td></tr>`).join('') + '</table>';
    mtoggle.onclick = ()=>mbox.classList.toggle('show');

    modelSpeak.style.marginLeft = '8px';
    modelSpeak.onclick = ()=>speakFR(mod.expression.modele, modelSpeak);
    box.appendChild(mtoggle); box.appendChild(modelSpeak); box.appendChild(mbox);
    body.appendChild(box);
  }, mod));

  return wrap;
}

function buildBlock(index, title, fillFn, mod){
  const block = el('section','block');
  block.dataset.section = index;
  const head = el('div','block-head');
  head.innerHTML = `<div class="title"><span class="num">${index+1}</span>${title}</div><span class="chev">▾</span>`;
  const body = el('div','block-body');
  const inner = el('div','block-inner');
  fillFn(inner);
  body.appendChild(inner);
  head.onclick = ()=>block.classList.toggle('open');
  block.appendChild(head); block.appendChild(body);
  if(index===0) block.classList.add('open');
  return block;
}

function seededOrder(n, key){
  let h = 2166136261;
  for(const c of key){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const arr = [...Array(n).keys()];
  for(let i=n-1;i>0;i--){ h = Math.imul(h ^ (h>>>15), 2246822507) + i; const j = Math.abs(h) % (i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function buildQcmModule(mod, idx){
  const wrap = el('div','module'+(idx===0?' active':''));
  wrap.id = 'mod-'+mod.slug;

  const banner = el('div','theme-banner');
  banner.innerHTML = `<span class="badge">${mod.titre} · QCM</span><h2>${mod.theme}</h2>`;
  wrap.appendChild(banner);

  const total = mod.sections.reduce((a,s)=>a+s.questions.length,0);
  const scoreBar = el('div','qcm-scorebar');
  scoreBar.innerHTML = `<div>Score total : <span class="qcm-total">0</span> / ${total}</div>`;
  const resetBtn = el('button','reveal-btn','Recommencer le QCM');
  resetBtn.type = 'button';
  scoreBar.appendChild(resetBtn);
  wrap.appendChild(scoreBar);

  const progress = el('div','progress');
  mod.sections.forEach(()=>{ const seg=el('div','seg'); seg.innerHTML='<i></i>'; progress.appendChild(seg); });
  wrap.appendChild(progress);

  // état : state[si][qi] = index choisi (ou undefined)
  const state = mod.sections.map(()=>({}));
  const secScoreEls = [];

  function refreshScores(){
    let totalOk = 0;
    mod.sections.forEach((sec, si)=>{
      let ok = 0;
      sec.questions.forEach((q,qi)=>{ if(state[si][qi] === q.a) ok++; });
      totalOk += ok;
      secScoreEls[si].textContent = ok + ' / ' + sec.questions.length;
    });
    scoreBar.querySelector('.qcm-total').textContent = totalOk;
  }

  mod.sections.forEach((sec, si)=>{
    wrap.appendChild(buildBlock(si, sec.titre, body=>{
      const head = el('div','qcm-sec-head','Score de la section : <span class="qcm-sec-score">0 / '+sec.questions.length+'</span>');
      secScoreEls[si] = head.querySelector('.qcm-sec-score');
      body.appendChild(head);

      sec.questions.forEach((qq, qi)=>{
        const opts = qq.t==='vf' ? ['Vrai','Faux'] : qq.o;
        const key = mod.slug+'-q'+si+'-'+qi;
        const order = qq.t==='vf' ? [0,1] : seededOrder(opts.length, key);
        const box = el('div','qcm-q');
        box.appendChild(el('div','qcm-qtext',
          '<span class="qcm-tag '+qq.t+'">'+(qq.t==='vf'?'Vrai / Faux':'QCM')+'</span> '+(qi+1)+'. '+qq.q));
        const list = el('div','qcm-opts'+(qq.t==='vf'?' vf':''));
        const fb = el('div','qcm-fb');
        const buttons = [];

        function reveal(oi){            // oi = index d'origine de l'option choisie
          state[si][qi] = oi;
          buttons.forEach((b,pos)=>{
            const orig = order[pos];
            b.disabled = true;
            if(orig === qq.a) b.classList.add('ok');
            else if(orig === oi) b.classList.add('ko');
          });
          const good = (oi === qq.a);
          fb.className = 'qcm-fb show ' + (good ? 'ok' : 'ko');
          fb.innerHTML = '<div><strong>' + (good ? '✔ Bonne réponse !' : '✘ Réponse attendue : ' + opts[qq.a]) + '</strong></div>' +
                         '<div class="qcm-why">ℹ ' + qq.w + '</div>';
          fb.appendChild(makeSpeakBtn(opts[qq.a] + '. ' + qq.w));
        }

        order.forEach((orig, pos)=>{
          const b = el('button','qcm-opt');
          b.type = 'button';
          b.innerHTML = '<span class="qcm-letter">'+(qq.t==='vf' ? (pos===0?'V':'F') : String.fromCharCode(65+pos))+'</span><span>'+opts[orig]+'</span>';
          b.onclick = ()=>{
            if(state[si][qi] !== undefined) return;
            reveal(orig);
            saveField(key, String(orig));
            refreshScores();
            const allDone = sec.questions.every((_,j)=>state[si][j] !== undefined);
            if(allDone) markProgress(mod, si);
          };
          buttons.push(b);
          list.appendChild(b);
        });

        const saved = loadField(key);
        if(saved !== null && saved !== '' && !isNaN(parseInt(saved,10)) && parseInt(saved,10) < opts.length){
          reveal(parseInt(saved,10));
        }

        box.appendChild(list);
        box.appendChild(fb);
        body.appendChild(box);
      });
    }, mod));
  });

  resetBtn.onclick = ()=>{
    if(!confirm('Recommencer ce QCM depuis le début ? Vos réponses seront effacées.')) return;
    mod.sections.forEach((s,si)=>s.questions.forEach((q,qi)=>{
      try{ localStorage.removeItem(STORAGE_PREFIX + mod.slug+'-q'+si+'-'+qi); }catch(e){}
    }));
    try{ localStorage.removeItem(STORAGE_PREFIX + mod.slug+'-progress'); }catch(e){}
    progressState[mod.slug] = new Set();
    const fresh = buildQcmModule(mod, idx);
    fresh.classList.add('active');
    wrap.replaceWith(fresh);
    applySavedProgress(mod);
    window.scrollTo({top:0, behavior:'smooth'});
  };

  refreshScores();
  return wrap;
}

const STORAGE_PREFIX = 'fleB2_';

function saveField(id, value){
  try{ localStorage.setItem(STORAGE_PREFIX + id, value); }catch(e){}
}
function loadField(id){
  try{ return localStorage.getItem(STORAGE_PREFIX + id); }catch(e){ return null; }
}

const progressState = {};
[...DATA, ...GRAMMAR_DATA, ...QCM_DATA].forEach(mod=>{
  const raw = loadField(mod.slug+'-progress');
  progressState[mod.slug] = new Set(raw ? JSON.parse(raw) : []);
});

function markProgress(mod, sectionIdx){
  progressState[mod.slug] = progressState[mod.slug] || new Set();
  progressState[mod.slug].add(sectionIdx);
  saveField(mod.slug+'-progress', JSON.stringify([...progressState[mod.slug]]));
  const wrap = document.getElementById('mod-'+mod.slug);
  const segs = wrap.querySelectorAll('.progress .seg i');
  segs.forEach((s,i)=>{ s.style.width = progressState[mod.slug].has(i) ? '100%' : '0%'; });
}

function applySavedProgress(mod){
  const wrap = document.getElementById('mod-'+mod.slug);
  const segs = wrap.querySelectorAll('.progress .seg i');
  segs.forEach((s,i)=>{ s.style.width = progressState[mod.slug].has(i) ? '100%' : '0%'; });
}

function resetAllProgress(){
  if(!confirm('Réinitialiser toute votre progression sur tous les modules ? Cette action est irréversible.')) return;
  Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_PREFIX)).forEach(k=>localStorage.removeItem(k));
  location.reload();
}

// Build tabs + modules
const tabsEl = document.getElementById('tabs');
const modulesEl = document.getElementById('modules');
const ALL_MODULES = [...DATA, ...GRAMMAR_DATA, ...QCM_DATA];
ALL_MODULES.forEach((mod,i)=>{
  const tab = el('div','tab'+(i===0?' active':''), mod.titre);
  tab.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('mod-'+mod.slug).classList.add('active');
  };
  tabsEl.appendChild(tab);
  modulesEl.appendChild(mod.qcmOnly ? buildQcmModule(mod,i) : mod.grammarOnly ? buildGrammarModule(mod,i) : buildModule(mod,i));
  applySavedProgress(mod);
});
document.getElementById('resetBtn').onclick = resetAllProgress;
addSpeakButtons(document);
</script>
